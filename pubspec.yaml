name: ai_money_manager
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  uuid: ^4.6.0
  fl_chart: ^1.3.1
  speech_to_text: ^7.5.0
  google_mlkit_translation: ^1.0.3
  package_info_plus: ^10.2.2
  dio: ^5.11.1
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png

flutter_native_splash:
  color: "#E5212E"
  color_dark: "#E5212E"
  android_12:
    color: "#E5212E"
